<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>DeepSeek Harness</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #0d1117;
        color: #e6edf3;
        font-family: "Segoe UI", system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .box {
        text-align: center;
      }
      .dot {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #4d6bfe;
        margin: 0 auto 20px;
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.35;
          transform: scale(0.85);
        }
        50% {
          opacity: 1;
          transform: scale(1.05);
        }
      }
      h1 {
        font-size: 16px;
        font-weight: 600;
        margin: 0 0 8px;
      }
      p {
        font-size: 12px;
        color: #8b949e;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="dot"></div>
      <h1>DeepSeek Harness</h1>
      <p>正在启动本地服务…</p>
    </div>
    <script>
      // 应用名由主进程通过 ?name= 传入（DIY 个性化后的名称）
      const params = new URLSearchParams(location.search);
      const name = params.get("name") || "DeepSeek Harness";
      document.title = name;
      document.querySelector("h1").textContent = name;
    </script>
  </body>
</html>
